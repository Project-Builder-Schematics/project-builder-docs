<svg width="1160" height="800" viewBox="0 0 1160 800" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#62666d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#7f56d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1159" height="799" rx="16" fill="#0f1011" stroke="#23252a"/>
  <line x1="24" y1="1.5" x2="1136" y2="1.5" stroke="#ffffff" stroke-opacity="0.05"/>

  <text x="48" y="54" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8a8f98">THE SDK ↔ ENGINE CONVERSATION</text>
  <g transform="translate(1088, 36) scale(1.2)">
    <path d="M11.2039 1.36914C11.2906 0.67556 10.419 0.297219 9.97151 0.834191L0.956775 11.6519C0.576834 12.1078 0.901043 12.8 1.49453 12.8H9.55705C9.9781 12.8 10.3039 13.169 10.2516 13.5868L9.49614 19.6309C9.40945 20.3244 10.281 20.7028 10.7285 20.1658L19.7432 9.34813C20.1232 8.8922 19.799 8.2 19.2055 8.2H11.1429C10.7219 8.2 10.3961 7.83097 10.4484 7.41318L11.2039 1.36914Z" fill="#7F56D9"/>
  </g>

  <!-- actors -->
  <rect x="240.5" y="84.5" width="280" height="56" rx="10" fill="#141516" stroke="#23252a"/>
  <text x="380" y="108" font-size="15" font-weight="600" fill="#f7f8f8" text-anchor="middle">SDK runner</text>
  <text x="380" y="127" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8a8f98" text-anchor="middle">TypeScript · your factory runs here</text>
  <rect x="700.5" y="84.5" width="280" height="56" rx="10" fill="#141516" stroke="#23252a"/>
  <text x="840" y="108" font-size="15" font-weight="600" fill="#f7f8f8" text-anchor="middle">Engine</text>
  <text x="840" y="127" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8a8f98" text-anchor="middle">Go · the only writer</text>

  <!-- cli feeds the engine -->
  <line x1="1050" y1="65" x2="905" y2="82" stroke="#62666d" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-gray)"/>
  <text x="1052" y="68" font-size="11" fill="#8a8f98">builder CLI: validated input, then starts the engine</text>

  <!-- lifelines -->
  <line x1="380" y1="140" x2="380" y2="700" stroke="#23252a" stroke-width="1.5"/>
  <line x1="840" y1="140" x2="840" y2="700" stroke="#23252a" stroke-width="1.5"/>

  <!-- 1: spawn -->
  <line x1="836" y1="172" x2="384" y2="172" stroke="#62666d" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
  <text x="610" y="160" font-size="12" fill="#c2c7d1" text-anchor="middle">spawns the runner — your factory + the user's input</text>

  <!-- 2: ready -->
  <line x1="836" y1="212" x2="384" y2="212" stroke="#62666d" stroke-width="1.4" marker-end="url(#arrow-gray)"/>
  <text x="610" y="200" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2c7d1" text-anchor="middle">ready · protocol v1</text>
  <text x="610" y="230" font-size="10.5" fill="#62666d" text-anchor="middle">the only message the engine ever initiates — from here on, the SDK asks</text>

  <!-- 3: buffer activity -->
  <rect x="252.5" y="252.5" width="256" height="96" rx="10" fill="#18191a" stroke="#23252a"/>
  <text x="268" y="276" font-size="12.5" font-weight="600" fill="#f7f8f8">factory chains mutations</text>
  <rect x="268.5" y="288.5" width="70" height="22" rx="5" fill="#0a0a0c" stroke="#34343a"/>
  <text x="303" y="303" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#d0d6e0" text-anchor="middle">create</text>
  <rect x="346.5" y="288.5" width="58" height="22" rx="5" fill="#0a0a0c" stroke="#34343a"/>
  <text x="375" y="303" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#d0d6e0" text-anchor="middle">copy</text>
  <rect x="412.5" y="288.5" width="70" height="22" rx="5" fill="#0a0a0c" stroke="#34343a"/>
  <text x="447" y="303" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#d0d6e0" text-anchor="middle">modify</text>
  <text x="268" y="332" font-size="11" fill="#8a8f98">buffered as directives — nothing on the wire yet</text>

  <!-- 4: flush 1 (read-triggered) -->
  <line x1="384" y1="384" x2="836" y2="384" stroke="#7f56d9" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="610" y="372" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b692f6" text-anchor="middle">ir.emit · Batch{ instructions[] }</text>
  <text x="610" y="402" font-size="10.5" fill="#62666d" text-anchor="middle">flush — a read needs the latest tree, so the buffer drains first</text>
  <rect x="856.5" y="368.5" width="240" height="30" rx="6" fill="#18191a" stroke="#23252a"/>
  <text x="976" y="388" font-size="11" fill="#8a8f98" text-anchor="middle">applied eagerly to the staging tree</text>

  <!-- 5: tree.read -->
  <line x1="384" y1="440" x2="836" y2="440" stroke="#62666d" stroke-width="1.4" marker-end="url(#arrow-gray)"/>
  <text x="610" y="428" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2c7d1" text-anchor="middle">tree.read { path }</text>
  <line x1="836" y1="478" x2="384" y2="478" stroke="#62666d" stroke-width="1.4" marker-end="url(#arrow-gray)"/>
  <text x="610" y="466" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2c7d1" text-anchor="middle">response { content }</text>
  <text x="610" y="496" font-size="10.5" fill="#62666d" text-anchor="middle">answered from the staging tree overlaid on the real project tree</text>

  <!-- 6: more buffering -->
  <rect x="252.5" y="516.5" width="256" height="34" rx="10" fill="#18191a" stroke="#23252a"/>
  <text x="380" y="538" font-size="11.5" fill="#8a8f98" text-anchor="middle">more mutations buffer…</text>

  <!-- 7: final flush -->
  <line x1="384" y1="586" x2="836" y2="586" stroke="#7f56d9" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="610" y="574" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b692f6" text-anchor="middle">ir.emit — final flush</text>
  <text x="610" y="604" font-size="10.5" fill="#62666d" text-anchor="middle">the factory returned</text>

  <!-- 8: commit -->
  <line x1="384" y1="640" x2="836" y2="640" stroke="#62666d" stroke-width="1.4" marker-end="url(#arrow-gray)"/>
  <text x="610" y="628" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2c7d1" text-anchor="middle">ir.commit</text>
  <text x="610" y="658" font-size="10.5" fill="#62666d" text-anchor="middle">on any throw the SDK sends ir.discard instead — nothing is written</text>

  <!-- 9: apply phase -->
  <rect x="700.5" y="688.5" width="340" height="64" rx="10" fill="#141516" stroke="#7f56d9" stroke-opacity="0.55"/>
  <text x="870" y="714" font-size="13" font-weight="600" fill="#f7f8f8" text-anchor="middle">Apply phase</text>
  <text x="870" y="736" font-size="11.5" fill="#8a8f98" text-anchor="middle">the staged result is written to disk — exit 0</text>

  <!-- footnote -->
  <text x="48" y="774" font-size="11.5" fill="#62666d">flush: buffered directives leave as one batch — when a read needs the tree, and when the factory ends. All-or-nothing is the commit/discard pair, not the batch.</text>
</svg>
